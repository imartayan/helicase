[package]
name = "helicase"
version = "0.2.0"
edition = "2024"
authors = ["Igor Martayan", "Charles Paperman"]
description = "SIMD-accelerated library for FASTA/FASTQ parsing and bitpacking"
keywords = ["bioinformatics", "fasta", "fastq", "bitpacking", "simd"]
categories = ["science::bioinformatics"]
repository = "https://github.com/imartayan/helicase"
documentation = "https://docs.rs/helicase"
readme = "../README.md"
license = "MIT"
autobenches = false

[lib]
bench = false

[dependencies]
deko = { version = "0.6", default-features = false }
flate2 = { version = "1.1", features = ["zlib-rs"], optional = true }
memchr = "2.8"
memmap2 = "0.9"
packed-seq = { version = "5.0", default-features = false, optional = true }
paraseq = { version = "0.6", default-features = false, optional = true }

[dev-dependencies]
fastx-gen = { path = "../fastx-gen" }
needletail = { version = "0.7", default-features = false }

[features]
default = ["gz", "zstd"]
bz2 = ["deko/bzip2"]
gz = ["deko/flate2", "flate2"]
xz = ["deko/xz"]
zstd = ["deko/zstd"]
no-pdep = []
needletail = []

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "packed"
required-features = ["packed-seq"]

[[example]]
name = "parallel_len_paraseq"
required-features = ["paraseq"]
