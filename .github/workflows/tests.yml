name: Tests
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Get CPU identifier
        id: cpu
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "id=$(grep -m1 'model name' /proc/cpuinfo | md5sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          else
            echo "id=$(sysctl -n machdep.cpu.brand_string | md5 | cut -c1-12)" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure cache
        uses: Swatinem/rust-cache@v2
        with:
          key: cpu-${{ steps.cpu.outputs.id }}
      - name: Run tests
        run: cargo test -p helicase --no-default-features --features std
      - name: Run tests with all features
        run: cargo test -p helicase --all-features
      # Baseline x86-64 has no SSSE3: this runs the scalar fallback.
      - name: Run tests without SIMD
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -C target-cpu=x86-64
        run: cargo test -p helicase --no-default-features --features std --release
