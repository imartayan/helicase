[package]
name = "helicase"
version = "1.1.0"
edition = "2024"
authors = ["Igor Martayan", "Charles Paperman"]
description = "SIMD-accelerated library for FASTA/FASTQ parsing and bitpacking"
keywords = ["bioinformatics", "fasta", "fastq", "bitpacking", "simd"]
categories = ["science::bioinformatics"]
repository = "https://github.com/imartayan/helicase"
documentation = "https://docs.rs/helicase"
readme = "../README.md"
license = "MIT"
rust-version = "1.89"
autobenches = false

[lib]
bench = false

[dependencies]
deko = { version = "0.6", default-features = false, optional = true }
memchr = { version = "2.8", default-features = false }
memmap2 = { version = "0.9", optional = true }
packed-seq = { version = "5.1", default-features = false, optional = true }
paraseq = { version = "0.6", default-features = false, optional = true }
sirocco = { version = "0.2", default-features = false, optional = true }
zstd = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
fastx-gen = { path = "../fastx-gen" }
flate2 = { version = "1.1", features = ["zlib-rs"] }
needletail = { version = "0.7", default-features = false }
zstd = "0.14"

[features]
default = ["std", "gz", "zstd"]
std = ["dep:deko", "dep:memmap2", "memchr/std", "sirocco?/std"]
bz2 = ["std", "deko/bzip2"]
gz = ["std", "dep:sirocco"]
xz = ["std", "deko/xz"]
zstd = ["std", "dep:zstd"]
no-pdep = []
needletail = ["std"]
packed-seq = ["std", "dep:packed-seq"]
paraseq = ["std", "dep:paraseq"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "fq_to_fa"
required-features = ["std"]

[[example]]
name = "histogram"
required-features = ["std"]

[[example]]
name = "minimal"
required-features = ["std"]

[[example]]
name = "parallel_len"
required-features = ["std"]

[[example]]
name = "packed"
required-features = ["packed-seq"]

[[example]]
name = "paraseq_parallel_len"
required-features = ["paraseq"]

[[example]]
name = "needletail_kmers"
required-features = ["needletail"]
