[package]
name = "bench"
version = "0.2.0"
edition = "2024"
publish = false
autobenches = false
autoexamples = false

[package.metadata.release]
release = false

[dependencies]
helicase = { path = "../helicase", features = ["packed-seq"] }
packed-seq = { version = "5.0", default-features = false }
fastx-gen = { path = "../fastx-gen" }
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
flate2 = "1.0"
needletail = { version = "0.7", default-features = false, features = [
    "flate2",
    "zstd",
] }
paraseq = { version = "0.6", default-features = false, features = ["niffler"] }
rayon = "1.12"
sysinfo = "0.39"
simd-minimizers = { version = "3.0", features = ["scalar"], optional = true }
sirocco = "0.2"
zstd = "0.14"

[package.metadata.cargo-machete]
ignored = ["simd-minimizers"]

[lib]
name = "bench"
path = "src/lib.rs"
bench = false

[[bin]]
name = "bench"
path = "src/main.rs"
bench = false

[[bin]]
name = "decompress_bench"
path = "src/decompress_bench.rs"
bench = false

[[bench]]
name = "bench"
harness = false
path = "benches/bench.rs"
test = false

[target.'cfg(target_os = "linux")'.dependencies]
perf-event2 = "0.7"

[features]
simd-minimizers = ["helicase/packed-seq", "dep:simd-minimizers"]
sirocco = ["helicase/sirocco"]

[[example]]
name = "simd_mini"
required-features = ["simd-minimizers"]
