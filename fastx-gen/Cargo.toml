[package]
name = "fastx-gen"
version = "0.1.0"
edition = "2024"
authors = ["Igor Martayan"]
description = "Deterministic FASTA/FASTQ generator for testing and benchmarking"
publish = false
autobenches = false

[package.metadata.release]
release = false

[lib]
bench = false

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
rand = { version = "0.10", default-features = false }

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "fastx-gen"
path = "src/main.rs"
bench = false
test = false
required-features = ["cli"]
