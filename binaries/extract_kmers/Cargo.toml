[package]
name = "extract_kmer"
version = "0.1.0"
edition = "2024"

[dependencies]
helicase = { path = "../../helicase" }
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
niffler = { version = "3.0", default-features = false, features = [
    "gz",
    "zstd",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "time"] }
parquet = "58.0.0"
arrow = "58.0.0"
paste = "1.0.15"
memmap2 = "0.9.10"
bytes = "1.11.1"
rayon = "1.11.0"
